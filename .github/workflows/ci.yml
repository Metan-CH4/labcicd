name: ci
on:
  pull_request:
  push: { branches: [main] }
permissions: { id-token: write, contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check . && pytest

  build:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs: { digest: "${{ steps.push.outputs.digest }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (local only)
        uses: docker/build-push-action@v7
        with: { context: ., load: true, tags: "scan:${{ github.sha }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Trivy gate
        uses: aquasecurity/trivy-action@0.36.0
        with: { image-ref: "scan:${{ github.sha }}", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login -n ${{ vars.ACR_NAME }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: "${{ vars.ACR_NAME }}.azurecr.io/app:${{ github.sha }}"
          cache-from: type=gha

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az aks install-cli
          az aks get-credentials -g ${{ vars.RG }} -n ${{ vars.AKS }}
          kubelogin convert-kubeconfig -l azurecli
      - run: |
          helm upgrade --install app ./chart -n staging --atomic --wait --timeout 3m \
            --set image.repository=${{ vars.ACR_NAME }}.azurecr.io/app \
            --set image.digest=${{ needs.build.outputs.digest }}
      - name: Smoke test
        run: kubectl -n staging run smoke --rm -i --restart=Never --image=curlimages/curl -- curl -fsS http://app/health

  deploy-prod:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: prod        # approval gate; same digest as staging
    steps:
      # same four steps as staging with -n prod
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az aks install-cli
          az aks get-credentials -g ${{ vars.RG }} -n ${{ vars.AKS }}
          kubelogin convert-kubeconfig -l azurecli
      - run: |
          helm upgrade --install app ./chart -n prod --atomic --wait --timeout 3m \
            --set image.repository=${{ vars.ACR_NAME }}.azurecr.io/app \
            --set image.digest=${{ needs.build.outputs.digest }}
      - name: Smoke test
        run: kubectl -n prod run smoke --rm -i --restart=Never --image=curlimages/curl -- curl -fsS http://app/health